<style>
:root{--ground:#ffffff;--panel:#ffffff;--ink:#1a1a1a;--ink-soft:#4f4f4a;--grey:#767676;--line:#e6e6e6;--line-2:#d5d5d5;
--y:#10595b;--yink:#0b3a3b;--green:#2e9e5b;--green-bg:#e7f5ec;--green-ln:#bfe4cc;--warn:#b5791a;--warn-bg:#fdf3d7;--warn-ln:#efdca6;}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ground);color:var(--ink);font-family:"Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}

/* ===== preview chrome (741 tool, not part of site look) ===== */
.preview-banner{background:#1a1a1a;color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:9px 14px;letter-spacing:.2px}
.toolbar{max-width:1100px;margin:0 auto;padding:12px 24px 0;display:flex;gap:10px;flex-wrap:wrap}
a.back,a.backlink{display:inline-block;font-size:12.5px;font-weight:700;color:var(--yink);text-decoration:none;background:color-mix(in srgb,var(--y) 10%,transparent);padding:6px 12px;border-radius:4px}

/* ===== site chrome (mimics shuiguru.de) ===== */
.site-header{border-bottom:1px solid var(--line);position:relative;z-index:5}
.header-inner{max-width:1100px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.brand img{height:32px;width:32px;border-radius:5px}
.site-nav{display:flex;gap:20px;flex-wrap:wrap;margin-left:auto;font-size:13.5px}
.site-nav a{color:var(--ink);text-decoration:none;opacity:.85}
.site-nav a:hover{opacity:1;color:var(--y)}
.nav-toggle{display:none;background:none;border:none;font-size:20px;cursor:pointer;margin-left:auto}
@media(max-width:820px){
  .site-nav{display:none;width:100%;flex-direction:column;gap:4px;margin-top:10px;order:3}
  .site-nav.open{display:flex}
  .header-inner{flex-wrap:wrap}
  .nav-toggle{display:block}
}

.hero{padding:64px 24px;display:flex;align-items:flex-end;min-height:280px}
.hero-inner{max-width:1100px;margin:0 auto;width:100%}
.site-h1{color:#fff;font-family:"Open Sans",sans-serif;font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.12;max-width:800px}
.hero-sub{color:#fff;opacity:.95;font-size:14.5px;margin-top:14px;display:flex;gap:16px 22px;flex-wrap:wrap;align-items:center}
.hero-sub a.cta-btn{background:#fff;color:var(--y);font-weight:700;text-decoration:none;padding:10px 22px;border-radius:0;font-size:14px}
@media(max-width:600px){.hero{padding:40px 20px;min-height:220px}}

main{max-width:760px;margin:0 auto;padding:44px 24px 20px}
.intro{font-size:13.5px;color:var(--ink-soft);background:var(--warn-bg);border:1px solid var(--warn-ln);border-left:4px solid var(--warn);border-radius:6px;padding:12px 16px;margin:0 0 22px}
.intro b{color:var(--ink)}
.fbbar{margin:0 0 30px;background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.fbbar .hint{font-size:13px;color:var(--ink-soft)}.fbbar .hint b{color:var(--ink)}
.fbbar .big{align-self:flex-start;font-weight:700;font-size:14px;background:var(--y);color:#fff;border:none;border-radius:0;padding:11px 24px;cursor:pointer}.fbbar .big:disabled{opacity:.6}

.block{position:relative;padding:22px 0;border-top:1px solid var(--line)}
.block:first-of-type{border-top:none;padding-top:0}
.block h2{font-family:"Open Sans",sans-serif;font-weight:900;font-size:25px;color:var(--y);letter-spacing:.1px;margin:2px 0 10px;line-height:1.2}
.block h3{font-size:16.5px;font-weight:700;margin:18px 0 4px}
.block p{font-size:16px;color:var(--ink);margin:10px 0;max-width:66ch}
.answer{font-size:16.5px;color:var(--ink);background:color-mix(in srgb,var(--y) 6%,var(--panel));border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin:0 0 8px}
.faq{border-top:1px solid var(--line);padding:12px 0}.faq:first-of-type{border-top:none}
.faq .q{font-weight:700;font-size:16px}.faq .a{font-size:15px;color:var(--ink-soft);margin-top:5px;max-width:66ch}
.cta{background:var(--y);color:#fff;border-radius:0;padding:26px 28px;margin-top:22px;text-align:center}
.cta b{color:#fff;font-size:19px}
.cta a{display:inline-block;margin-top:14px;background:#fff;color:var(--y);font-weight:700;text-decoration:none;padding:12px 26px;border-radius:0;font-size:14.5px}
.todo{color:var(--warn);font-weight:600}
.tech{margin:28px auto 0;max-width:760px;padding:0 24px 30px;border-top:1px dashed var(--line-2)}
.tech>summary{cursor:pointer;list-style:none;padding:16px 0 4px;font-weight:700;font-size:13px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px}
.tech>summary::-webkit-details-marker{display:none}
.tech>summary::before{content:"▸ ";color:var(--y)}.tech[open]>summary::before{content:"▾ "}
.tech .tb{padding:6px 0 0;font-size:13px;color:var(--ink-soft)}
.tech .meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;background:#fafafa;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:8px 0;color:var(--ink)}
.fb{position:absolute;top:22px;right:0;display:inline-flex;gap:5px}
.fb button{font-family:inherit;font-size:10.5px;font-weight:700;border:1px solid var(--line-2);background:#fff;color:var(--grey);border-radius:4px;padding:4px 9px;cursor:pointer}
.fb .ok.done{background:var(--green-bg);border-color:var(--green-ln);color:var(--green)} .fb .cm.done{background:var(--warn-bg);border-color:var(--warn-ln);color:var(--warn)}
.fbbox{display:none;margin-top:8px}.fbbox textarea{width:100%;min-height:54px;border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;font-family:inherit;font-size:13px}
.fbbox .send{margin-top:6px;font-weight:700;font-size:12px;background:var(--y);color:#fff;border:none;border-radius:0;padding:7px 14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:6px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.site-footer{border-top:1px solid var(--line);margin-top:20px;padding:34px 24px;background:#fafafa}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--grey)}
.footer-nav a{color:var(--grey);text-decoration:none;margin-right:16px}
.footer-nav a:hover{color:var(--y)}
.cmp-wrap table th,.cmp-wrap table td{font-family:"Open Sans",sans-serif}

/* ===== content elements (instead of plain running text) ===== */
.el-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:16px 0}
.el-card{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:16px 14px;border-top:3px solid var(--y)}
.el-card .ic{font-size:22px;line-height:1}
.el-card b{display:block;margin:8px 0 4px;font-size:15px;color:var(--ink)}
.el-card p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:none}

.step-flow{display:flex;flex-direction:column;gap:0;margin:18px 0;counter-reset:step}
.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:none;padding-top:0}
.step .num{counter-increment:step;flex:none;width:30px;height:30px;border-radius:50%;background:var(--y);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.step .num::before{content:counter(step)}
.step .stxt b{display:block;font-size:15.5px;color:var(--ink);margin-bottom:2px}
.step .stxt p{font-size:14.5px;color:var(--ink-soft);margin:0;max-width:none}

.check-list{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:9px}
.check-list li{display:flex;gap:10px;font-size:15.5px;color:var(--ink);align-items:flex-start}
.check-list li::before{content:"✓";flex:none;color:var(--y);font-weight:900;line-height:1.5}

.stat-badge{display:inline-flex;align-items:baseline;gap:7px;background:color-mix(in srgb,var(--y) 8%,var(--panel));border:1px solid var(--line);border-radius:6px;padding:4px 12px;margin:2px 4px 2px 0;font-size:13.5px;color:var(--ink-soft)}
.stat-badge b{font-size:17px;color:var(--y);font-weight:900}

.area-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;max-width:520px}
.area-grid div{background:#fafafa;border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
.area-grid div.mid{background:color-mix(in srgb,var(--y) 10%,#fafafa);border-color:var(--y);color:var(--y);font-weight:700}
@media(max-width:480px){.area-grid{grid-template-columns:repeat(3,1fr);max-width:100%}.area-grid div{font-size:11px;padding:8px 4px}}

.dir-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.dir-card{background:#fafafa;border:1px solid var(--line);border-top:3px solid var(--y);border-radius:8px;padding:14px 10px;text-align:center}
.dir-card .ic{font-size:20px;line-height:1}
.dir-card b{display:block;margin:8px 0 3px;font-size:14px;color:var(--ink)}
.dir-card span.tag{font-size:11.5px;color:var(--ink-soft)}
@media(max-width:600px){.dir-grid{grid-template-columns:repeat(2,1fr)}}

.price-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:16px 0}
.price-card{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:18px 16px}
.price-card b.ttl{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
.price-card .amt{display:block;font-size:24px;font-weight:900;color:var(--y);margin-bottom:8px}
.price-card p{font-size:13.5px;color:var(--ink-soft);margin:0;max-width:none}
@media(max-width:600px){.price-grid{grid-template-columns:1fr}}
</style>
