<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bali Healing · Client dashboard prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* 741 Martin guide callout · v1 2026-10-12 · rules: README.md */
.mg{--mg-accent:#fac118;--mg-ink:#1d1d1f;--mg-bubble:#ffffff;--mg-line:#e8e1d3;
  display:flex;align-items:flex-end;gap:14px;margin:28px 0;max-width:min(640px,100%);box-sizing:border-box;font-family:"DM Sans",system-ui,sans-serif}
.mg__img{width:112px;height:auto;flex:0 0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.mg__bubble{position:relative;min-width:0;flex:1 1 auto;overflow-wrap:anywhere;background:var(--mg-bubble);color:var(--mg-ink);border:1px solid var(--mg-line);
  border-left:4px solid var(--mg-accent);border-radius:14px;padding:14px 18px;margin-bottom:34px;
  font-size:16px;line-height:1.5;box-shadow:0 8px 24px rgba(20,20,30,.08)}
.mg__bubble p{margin:0}.mg__bubble p+p{margin-top:6px}
.mg__name{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a6d00;margin-bottom:4px}
.mg__bubble::before{content:"";position:absolute;left:-11px;bottom:18px;width:16px;height:16px;background:var(--mg-bubble);
  border-left:1px solid var(--mg-line);border-bottom:1px solid var(--mg-line);transform:rotate(45deg)}
/* Martin on the right, bubble on the left */
.mg--right{flex-direction:row-reverse;margin-left:auto}
.mg--right .mg__bubble{border-left:1px solid var(--mg-line);border-right:4px solid var(--mg-accent)}
.mg--right .mg__bubble::before{left:auto;right:-11px;transform:rotate(225deg)}
.mg--flip .mg__img{transform:scaleX(-1)}
.mg--small .mg__img{width:72px}.mg--small .mg__bubble{font-size:14px;padding:10px 14px;margin-bottom:20px}
/* on dark sections */
.mg--dark{--mg-bubble:#1f2a44;--mg-ink:#f5f2ea;--mg-line:#33405f}.mg--dark .mg__name{color:var(--mg-accent)}
/* reveal once, calm (CRO motion spec) */
.mg[data-reveal]{opacity:0;transform:translateY(12px);transition:opacity .45s ease,transform .45s ease}
.mg[data-reveal].is-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.mg[data-reveal]{opacity:1;transform:none;transition:none}}
@media (max-width:600px){.mg{gap:10px}.mg--right{margin-left:0}.mg__img{width:64px}.mg__bubble{font-size:15px;margin-bottom:16px}}
@media print{.mg{break-inside:avoid}.mg__img{filter:none}.mg__bubble{box-shadow:none}.mg[data-reveal]{opacity:1;transform:none}}
</style>
<style>
:root{--yellow:#fac118;--ink:#252525;--cream:#fffcf3;--paper:#fff;--line:#e8e1d3;--soft:#6b665a;--mute:#8c8677;
--bar:#c9c2ae;--bar-now:#252525;--green:#2e7d4f;--green-bg:#e7f6ed;--amber:#a86a00;--amber-bg:#fdf3d7;--red:#b3261e;--red-bg:#fdeceb;--grey:#6b665a;--grey-bg:#f1eee6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font-family:inherit;cursor:pointer}
.proto{background:var(--ink);color:#fff;font-size:13px;padding:6px 16px;text-align:center}
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--paper);border-bottom:1px solid var(--line)}
.top img{height:30px}.top .who{margin-left:auto;font-size:14px;color:var(--soft)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 24px 96px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;white-space:nowrap;color:var(--ink);text-decoration:none}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .n{display:inline-block;background:var(--yellow);color:var(--ink);border-radius:999px;font-size:12px;font-weight:700;padding:0 7px;margin-left:6px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 18px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 12px;font-size:14px;text-decoration:none;color:var(--soft)}
.pill.on{background:var(--yellow);color:var(--ink);border-color:var(--yellow);font-weight:700}
.sw{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.sw button{border:0;background:transparent;padding:6px 12px;font-size:14px;color:var(--soft)}.sw button.on{background:var(--ink);color:#fff}
h1.t{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:38px;line-height:1.1;letter-spacing:.2px;margin:2px 0 6px}
h2{font-size:19px;font-weight:700;margin:0 0 4px}
h3{font-size:16px;font-weight:700}
.lead{font-size:18px;color:var(--ink);margin:0 0 18px;max-width:62ch}
.mut{color:var(--soft);font-size:14px}.mut.s{font-size:13px;color:var(--mute)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.gap{margin-top:16px}.gap2{margin-top:28px}
.q{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.big{font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.5px;border-bottom:4px solid var(--yellow);display:inline-block;padding-bottom:2px}
.big.plain{border:0}
.sentence{margin:10px 0 12px;font-size:16px}
.chk{font-size:12px;color:var(--mute);margin-top:8px}
/* status */
.st{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700}
.st svg{width:12px;height:12px;flex:0 0 auto}
.st.green{background:var(--green-bg);color:var(--green)}.st.amber{background:var(--amber-bg);color:var(--amber)}.st.red{background:var(--red-bg);color:var(--red)}.st.grey{background:var(--grey-bg);color:var(--grey)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:var(--r);padding:14px 18px;margin-bottom:16px;font-size:16px;border:1px solid}
.banner.red{background:var(--red-bg);border-color:#efc3bf;color:#6d1a15}.banner.amber{background:var(--amber-bg);border-color:#ecd9a0;color:#5b3b00}.banner.green{background:var(--green-bg);border-color:#bfe3cd;color:#1d5133}
.banner b{font-weight:700}
.strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;gap:3px}.seg i{width:14px;height:8px;border-radius:2px;background:#e3dccb}.seg i.d{background:var(--ink)}.seg i.n{background:var(--yellow)}
/* needs you */
.need{border:1px solid #ecd9a0;background:#fffbea;border-radius:var(--r);padding:18px 20px}
.need ul{list-style:none;margin-top:10px}
.need li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #f0e4b8;flex-wrap:wrap}
.need li:first-child{border-top:0}
.need li .tx{flex:1 1 260px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:700;background:var(--yellow);color:var(--ink);text-decoration:none;display:inline-block}
.btn.o{background:transparent;border:1px solid var(--ink)}
/* charts */
svg.bars{width:100%;height:auto;display:block}
svg.bars text{font-family:"DM Sans",sans-serif;fill:var(--soft);font-size:11px}
svg.bars .v{fill:var(--ink);font-weight:700;font-size:12px}
.tile .num{font-size:30px;font-weight:700;line-height:1.1}
.tile .d{font-size:14px;color:var(--soft);margin:2px 0 6px}
.dl{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;color:var(--soft)}
/* lists, rows */
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid #f1ebdc;vertical-align:top}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.row .l{flex:0 0 120px}.row .b{flex:1;height:12px;background:#efe9d9;border-radius:6px;overflow:hidden}.row .b i{display:block;height:100%;background:var(--bar-now);border-radius:6px}.row .c{flex:0 0 44px;text-align:right;font-weight:700}
.bar3 .b i.t{background:var(--bar)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kw{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1ebdc;font-size:15px}
.kw b{white-space:nowrap}
.heat{display:grid;grid-template-columns:minmax(140px,1.6fr) repeat(3,minmax(0,1fr));gap:3px;font-size:13px}
.heat div{padding:7px 6px;border-radius:5px;text-align:center}
.heat .h{font-weight:700;color:var(--mute);font-size:12px;background:none}.heat .k{text-align:left;font-size:14px;background:none;padding-left:0}
.hz0{background:#f1eee6;color:#6b665a}.hz1{background:#e6e0cf}.hz2{background:#cfc6ad}.hz3{background:#8f8566;color:#fff}.hz4{background:#252525;color:#fff}
.gapcard{border:2px dashed #d7cfb8;border-radius:var(--r);padding:16px 18px;background:#fffefa}
.tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tr .col h3{display:flex;justify-content:space-between;margin-bottom:8px}
.trk{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.trk .o{font-size:13px;color:var(--soft);margin-top:4px}
.tree details{border-top:1px solid #f1ebdc;padding:8px 0}.tree summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--grey-bg);color:var(--grey);white-space:nowrap}
.badge.up{background:var(--amber-bg);color:var(--amber)}.badge.new{background:var(--yellow);color:var(--ink)}
.dec{border:1px solid #ecd9a0;background:#fffbea;border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.dec label{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.dec input{margin-top:5px}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.foot{margin-top:28px;font-size:13px;color:var(--mute)}
.chat{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.mg{margin:4px 0 18px}
.dim{opacity:.55}
@media(max-width:860px){.grid3,.grid2,.cols3,.tr{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:16px 16px 96px}.top{padding:10px 16px}h1.t{font-size:32px}.big{font-size:38px}.heat{grid-template-columns:minmax(110px,1.4fr) repeat(3,minmax(0,1fr));font-size:12px}.row .l{flex-basis:96px}}
</style>
</head>

 <div class="card gap2"><h2>Content plan</h2><p class="mut">45 topics from real searches. 19 are top priority. Live so far: not counted yet.</p><p class="sentence">Next up: Craniosacral Therapy · Prolozone Injection · NAET Allergy Treatment · Reiki in Canggu · Ozone Insufflation vs Autohemotherapy · "Bali Healing Therapy" landing page.</p></div>
 <a class="btn gap" href="${RURL}balihealing-seo-roadmap.html">Open the full roadmap</a>`}
function decisions(){return `${tabs('decisions')}<h1 class="t">Your decisions</h1>${mg('hello','Hi Peggy, hi Pasha. For each point I marked my recommendation. One click is enough.','Martin waves')}
 ${D.decisions.map((d,i)=>`<div class="dec"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>${d[0]}</h3>${st('amber','Needs you')}</div><p class="mut" style="margin-top:4px">${d[1]}</p>${d[2].map((o,j)=>`<label><input type="radio" name="d${i}" ${j==0&&d[2].length?'checked':''}> ${o}</label>`).join('')}
 <div class="act"><button class="btn" onclick="this.textContent='Saved (prototype)'">Approve</button><button class="btn o">Approve with a small change</button><button class="btn o">Request a change</button></div><p class="mut s" style="margin-top:8px">If you do not reply, we keep this open and remind you.</p></div>`).join('')}`}
function reports(){return `${tabs('reports')}<h1 class="t">Reports</h1><p class="lead">Every report with its date. Older versions point to the current page.</p>
 <div class="card"><table class="t"><tr><th>Report</th><th>Period</th><th>State</th><th></th></tr>${D.reports.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${/Replaced/.test(r[3])?st('grey','Replaced'):st('green','Current')}<div class="mut s">${/Replaced/.test(r[3])?r[3]:''}</div></td><td>${r[2]?`<a class="btn o" href="${RURL}${r[2]}">Open</a>`:''}</td></tr>`).join('')}</table></div>`}
function setup(){const steps=[['Sign contract and DPA','done','Signed 25 Sep'],['Grant access','done','4 of 4 required platforms connected'],['Business details','open','Check name, services, practitioners, hours'],['Upload material','open','Logo, photos, videos, certificates'],['Positioning questions','open','Top 3 services, ideal client, competitors'],['Programme start','done','Running since 14 Sep']];
 const acc=[['Google Analytics','Connected','green','12 Oct'],['Google Business Profile','Connected','green','12 Oct'],['Google Search Console','Connected','green','12 Oct'],['Website / CMS','Connected','green','12 Oct'],['Google Tag Manager','Not needed yet','grey',''],['Directory logins','Not needed yet','grey',''],['Facebook / Instagram','Not needed yet','grey','']];
 return `${tabs('setup')}<h1 class="t">Setup</h1><p class="lead"><b>3 of 6 steps done.</b> The ticks come from your real data. Open steps also appear in "Needs you" on the Overview.</p>
 <div class="card">${steps.map(s=>`<div class="row"><span style="flex:0 0 auto">${s[1]=='done'?st('green','Done'):st('amber','Open')}</span><span style="flex:1"><b>${s[0]}</b><div class="mut s">${s[2]}</div></span></div>`).join('')}</div>
 <div class="card gap2"><h2>Platforms</h2>${acc.map(a=>`<div class="row"><span style="flex:1"><b>${a[0]}</b></span>${st(a[2],a[1])}<span class="mut s" style="flex:0 0 90px">${a[3]?'checked '+a[3]:''}</span></div>`).join('')}</div>
 <p class="foot">When all steps are done, this tab disappears and one line stays: "Setup complete".</p>`}
function render(){const h=(location.hash||'#/overview').replace('#/','').split('/');let html;
 if(h[0]=='results'){html={enquiries,found,reviews,ads,backlinks}[h[1]||'enquiries']()}
 else html=({overview,plan,decisions,reports,setup}[h[0]]||overview)();
 $('#app').innerHTML=html;window.scrollTo(0,0)}
addEventListener('hashchange',render);render();
</script>
