    <td class="hm" onclick="event.stopPropagation()">${srcs(i)}</td></tr>`;
}

/* ---------- Ansicht 1: Heute (Admin) ---------- */
function renderToday() {
  const mine = ITEMS.filter(i => i.doer === 'Martin' && i.st !== 'done');
  const check = ITEMS.filter(i => i.st === 'needs_check');
  const waitTeam = ITEMS.filter(i => i.st === 'waiting' && i.wait === 'Martin');
  const waitClient = ITEMS.filter(i => i.st === 'waiting' && (i.wait === 'Kunde' || i.wait === 'Google'));
  const agents = ITEMS.filter(i => i.doer === 'Agent' && i.st === 'in_progress');
  const K = [['mine','Wartet auf dich',mine],['check','Prüfen (Agent/Team fertig)',check],['blocked','Team wartet auf dich',waitTeam],['client','Wartet auf Kunde / Google',waitClient],['agents','Agenten arbeiten',agents]];
  let list = F.kpi ? K.find(k => k[0] === F.kpi)[2] : [...mine.filter(i => i.due), ...check, ...waitTeam];
  list = list.slice(0, 12);
  const ex = CLIENTS.filter(c => c.band !== 'grn'), ok = CLIENTS.filter(c => c.band === 'grn');
  $('today').innerHTML = `<h1>Heute · 13.10.</h1>
  <p class="lead">Oben steht nur, was dich braucht. Jede Zeile hat eine verantwortliche Person, wer es macht, Status, Alter und die Quelle. Ein Klick öffnet die Details.</p>
  <div class="kpis">${K.map(k => `<div class="kpi${F.kpi === k[0] ? ' on' : ''}" onclick="F.kpi=F.kpi==='${k[0]}'?null:'${k[0]}';renderToday()"><b>${k[2].length}</b><span>${k[1]}</span></div>`).join('')}</div>
  <div class="grid2">
   <div class="card"><h2>${F.kpi ? esc(K.find(k => k[0] === F.kpi)[1]) : 'Zuerst erledigen'} <span class="muted">max. 12 · ${F.kpi ? '<a href="#" onclick="F.kpi=null;renderToday();return false">alle zeigen</a>' : 'heute fällig, prüfen, Team wartet'}</span></h2>
    <table><thead><tr><th>Kunde</th><th>Aufgabe · nächster Schritt</th><th>Verantwortlich → macht</th><th>Status</th><th class="hm">Quelle</th></tr></thead><tbody>${list.map(i => rowHTML(i, true)).join('')}</tbody></table></div>
   <div class="card"><h2>Kunden <span class="muted">${ex.length} brauchen Aufmerksamkeit</span></h2>
    <table><tbody>${ex.map(c => `<tr class="click" onclick="${c.id === 'suriya' ? "show('client')" : 'void 0'}"><td><b>${esc(c.name)}</b><div class="next">${esc(c.reason)}</div><div class="next">→ ${esc(c.next)} · ${who(c.doer || c.owner)}</div></td><td><span class="band ${BAND[c.band][1]}">${BAND[c.band][0]}</span><div class="age">${esc(c.phase)} · ${esc(c.last)}</div></td></tr>`).join('')}</tbody></table>
    <div class="ok-line">✓ ${ok.length} im Plan: ${ok.map(c => esc(c.name)).join(', ')}</div>
    <p class="muted" style="margin-top:10px">Farbe = Vorschlag aus Signalen (Blocker, Wartezeit, überfällig, keine Aktivität). Du bestätigst sie im wöchentlichen Check. „Keine Daten“ heißt: nichts erfasst, nicht „alles gut“.</p></div>
  </div>`;
}

/* ---------- Ansicht 2: Kunde (Suriya) ---------- */
function renderClient() {
  const all = ITEMS.filter(i => i.c === 'suriya');
  const owners = ['Alle','Martin','Team','Agent','Kunde'];
  const pass = i => F.owner === 'Alle' || (F.owner === 'Team' ? PEOPLE[i.doer] === 'team' : i.doer === F.owner);
  const tasks = all.filter(i => i.type !== 'client_todo' && pass(i));
  const todos = all.filter(i => i.type === 'client_todo');
  const cur = PH.findIndex(p => p[0] === 'P4');
  $('client').innerHTML = `<span class="muted" style="cursor:pointer" onclick="show('today')">← Heute</span>
  <h1 style="margin-top:6px">Praxis Suriya <span class="band b-amb" style="vertical-align:middle">Gelb</span></h1>
  <div class="goal"><span class="muted">Quartalsziel</span><b>Top 3 im Maps-Raster für die 5 beobachteten Keywords</b><span class="muted">bis 01.12. · erster Scan ~19.10.</span></div>
  <div class="goal"><span class="muted">Zielzahlen</span><span>Maps-Raster: Ausgangswert fehlt (Scan ~19.10.)</span><span>Anfragen pro Woche: ~2 (Basis 28.06.–23.09.)</span></div>
  <div class="phases">${PH.map((p, k) => `<div class="ph${k < cur ? ' done' : k === cur ? ' cur' : ''}">${p[0]}<small>${esc(p[1])}</small></div>`).join('')}</div>
  <p class="muted">Programm-Woche 6 von 13 · Wochenplan (alt): 22 von 44 abgehakt. Der Fortschritt kommt künftig aus den echten Aufgaben unten.</p>
  <div class="grid2" style="margin-top:14px">
   <div>
    <div class="card"><h2>Aufgaben <span class="muted">eine Liste für alle</span></h2>
     <div class="chips">${owners.map(o => `<button class="chip${F.owner === o ? ' on' : ''}" onclick="F.owner='${o}';renderClient()">${o}</button>`).join('')}</div>
     <table><thead><tr><th>Aufgabe · nächster Schritt</th><th>Verantwortlich → macht</th><th>Status</th><th class="hm">Quelle</th></tr></thead><tbody>${tasks.map(i => rowHTML(i, false)).join('') || '<tr><td colspan="4" class="muted">Nichts in diesem Filter.</td></tr>'}</tbody></table></div>
    <div class="card"><h2>Ergebnisse <span class="muted">was erarbeitet wurde, mit Nachweis</span></h2>${OUTCOMES.map(o => `<div class="outc"><div class="ct">${esc(o.text)}</div><div class="meta"><span>Zielzahl: ${esc(o.metric)}</span><span>vorher ${esc(o.before)} → nachher ${esc(o.after)}</span><span class="conf ${o.conf === 'confirmed' ? 'c-ok' : 'c-as'}">${o.conf === 'confirmed' ? 'bestätigt' : 'angenommen'}</span></div><div class="meta"><span>Nachweis: <button class="src">${esc(o.proof[0])}</button></span><span>${esc(o.date)}</span><span>Zeit/Kosten: ${esc(o.time)}</span><span>${o.vis === 'client' ? '👁 Kunde sieht es' : '🔒 intern'}</span></div></div>`).join('')}</div>
   </div>
   <div>
    <div class="card"><h2>Wartet auf Coralie <span class="muted">${todos.length}</span></h2><table><tbody>${todos.map(i => `<tr class="click" onclick="openItem('${i.id}')"><td>${esc(i.title)}<div class="next">${esc(i.effect)}</div></td><td><span class="age${days(i.since) >= 7 ? ' old' : ''}">${ageTxt(i.since)}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h2>Entscheidungen <span class="muted">aus dem Tab „Entscheidungen“</span></h2><div class="next">5 Entwürfe, Coralie sieht noch nichts. E1 Preis, E4 Analyse und E5 Ratgeber brauchen ihr aktives Ja.</div></div>
    <div class="card"><h2>Kunden-Regeln <span class="muted">gelten für alle Agenten</span></h2><ul class="next" style="margin:0;padding-left:18px"><li>Keine Backlink- oder Disavow-Arbeit</li><li>Keine große Änderung ohne Backup und ihr OK</li><li>Keine URL-Änderungen</li><li>Ayurveda-Massage-Seite unantastbar</li><li>Kontaktwege bleiben</li></ul></div>
    <div class="card"><h2>Verlauf <span class="muted">eigener Bereich, nicht auf dem Startbildschirm</span></h2><div class="feed">${FEED.map(f => `<div>${esc(f[0])} · <b>${esc(f[1])}</b> · ${esc(f[2])}<br><i>Quelle: ${esc(f[3])}</i></div>`).join('')}</div></div>
   </div>
  </div>`;
}

/* ---------- Ansicht 3: Meine Aufgaben (Team) ---------- */
function renderTeam() {
  const ppl = ['Dinakar','Tantri','Gayo'];
  const mine = ITEMS.filter(i => i.doer === F.team);
  const order = {planned:1, in_progress:0, waiting:2, needs_check:3, done:4};
  mine.sort((a, b) => order[a.st] - order[b.st]);
  $('who').textContent = 'Angemeldet als ' + F.team + ' (Team)';
  $('team').innerHTML = `<h1>Meine Aufgaben</h1>
  <p class="lead">Jede Person sieht nur ihre eigenen Aufgaben, über alle Kunden. Erledigt geht nur mit einem Nachweis-Link. Martin prüft und setzt dann „Erledigt“.</p>
  <div class="chips">${ppl.map(p => `<button class="chip${F.team === p ? ' on' : ''}" onclick="F.team='${p}';renderTeam()">${p}</button>`).join('')}</div>
  ${mine.map(i => `<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><b>${esc(cname(i.c))}</b>${st(i)}<span class="age">${ageTxt(i.since)}</span></div>
   <div style="font-size:16px;font-weight:700;margin:6px 0">${esc(i.title)}</div>
   ${i.blocked ? `<div class="next">⛔ Blockiert durch: ${esc(ITEMS.find(x => x.id === i.blocked).title)}</div>` : ''}
   <dl class="dl"><dt>Übergabe</dt><dd>${esc(i.next || '–')}</dd><dt>Fertig heißt</dt><dd>${esc(i.defdone || 'Martin trägt das beim Übergeben ein')}</dd><dt>Unterlagen</dt><dd>${srcs(i)}</dd><dt>Verantwortlich</dt><dd>${who(i.acc)}</dd></dl>
   ${i.st === 'needs_check' ? '<div class="next">✓ Gemeldet, Martin prüft.</div>' : `<div class="row-acts"><input class="proof" id="pf-${i.id}" placeholder="Nachweis-Link (URL, Screenshot, Drive)"><button class="btn b1" onclick="report('${i.id}')">Fertig melden</button><button class="btn b2" onclick="alert('Prototyp: Frage geht an Martin und erscheint bei ihm unter „Team wartet auf dich“.')">Frage an Martin</button></div>`}
  </div>`).join('') || '<div class="card muted">Keine Aufgaben.</div>'}`;
}
function report(id) {
  const v = ($('pf-' + id).value || '').trim();
  if (!v) { alert('Bitte zuerst einen Nachweis-Link eintragen.'); return; }
  const i = ITEMS.find(x => x.id === id); i.st = 'needs_check'; i.src = [...(i.src || []), [v, 'page', 'proves']];
  renderTeam();
}

/* ---------- Ansicht 4: Kundenansicht (Coralie) ---------- */
function renderCview() {
  const todos = ITEMS.filter(i => i.c === 'suriya' && i.type === 'client_todo');
  const next = ITEMS.filter(i => i.c === 'suriya' && i.vis === 'client' && i.type !== 'client_todo' && i.st !== 'done');
  const res = OUTCOMES.filter(o => o.c === 'suriya' && o.vis === 'client');
  $('cview').innerHTML = `<div class="note">Vorschau der Kundenansicht (Schritt 3). Sie liest dieselben Daten, zeigt aber nur freigegebene Zeilen. Keine internen Notizen, keine Agenten-Schritte, keine Stunden.</div>
  <h1>Hallo Coralie</h1><p class="lead">Hier siehst du, wo wir stehen, was als Nächstes kommt und was wir von dir brauchen.</p>
  <aside class="mg"><img class="mg__img" src="martin-guide/martin-hello.webp" alt="Martin von 741 winkt zur Begrüßung" width="112"><div class="mg__bubble"><span class="mg__name">Martin</span><p>Schön, dass du da bist. Ganz oben steht, was gerade von dir abhängt, alles andere erledigen wir.</p></div></aside>
  <div class="blocks">
   <div class="blk need"><h3>Was wir von dir brauchen</h3><ul>${todos.map(i => `<li><b>${esc(i.ctext)}</b><br><span class="next">${esc(i.effect)} · offen ${ageTxt(i.since)}</span></li>`).join('')}</ul>
    <aside class="mg mg--small" style="margin:12px 0 0"><img class="mg__img" src="martin-guide/martin-point.webp" alt="Martin von 741 zeigt auf die Liste" width="72"><div class="mg__bubble"><span class="mg__name">Martin</span><p>Die Admin-Rolle in WordPress ist der wichtigste Punkt. Danach legen wir sofort los.</p></div></aside></div>
   <div class="blk"><h3>Wo wir stehen</h3><p style="margin:0">Phase <b>Aufbau</b>, Woche 6 von 13.</p><p class="next">Ziel bis 01.12.: Top 3 bei Google Maps für deine 5 wichtigsten Suchbegriffe. Die erste Messung kommt um den 19.10., danach siehst du hier jede Woche, wie sich deine Plätze bei Google verändern.</p></div>
   <div class="blk"><h3>Was als Nächstes kommt</h3><ul>${next.map(i => `<li>${esc(i.ctext)}</li>`).join('')}<li>5 Entscheidungen für dich im Bereich „Entscheidungen“</li></ul></div>
   <div class="blk"><h3>Wen du fragst</h3><p style="margin:0">Martin, über den Chat hier im Portal oder per WhatsApp.</p></div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Was wir erreicht haben</h2>${res.map(o => `<div class="outc"><div class="ct">${esc(o.text)}</div><div class="meta"><span>Nachweis: <button class="src">${esc(o.proof[0])}</button></span><span>${esc(o.date)}</span></div></div>`).join('')}</div>`;
}

/* ---------- Detail-Schublade ---------- */
function openItem(id) {
  const i = ITEMS.find(x => x.id === id);
  const d = $('drawer');
  d.innerHTML = `<button class="x" onclick="$('drawer').classList.remove('on')">×</button><h3>${esc(i.title)}</h3>${st(i)}
  <dl class="dl"><dt>Kunde</dt><dd>${esc(cname(i.c))}</dd><dt>Verantwortlich</dt><dd>${who(i.acc)} (immer ein Mensch)</dd><dt>Macht es</dt><dd>${who(i.doer)}</dd>
  <dt>Nächster Schritt</dt><dd>${esc(i.next || '–')}</dd><dt>Alter</dt><dd>${ageTxt(i.since)}</dd>${i.due ? `<dt>Fällig</dt><dd>${esc(i.due)}</dd>` : ''}
  <dt>Fertig heißt</dt><dd>${esc(i.defdone || '–')}</dd><dt>Quellen</dt><dd>${(i.src || []).map(s => `${esc(s[0])} <span class="muted">(${s[2] === 'produced' ? 'erzeugt' : s[2] === 'proves' ? 'Nachweis' : 'genutzt'})</span>`).join('<br>') || '–'}</dd>
  <dt>Zeit / Kosten</dt><dd>${esc(i.time || 'nicht erfasst')}${i.cost ? ' · ' + esc(i.cost) : ''}</dd><dt>Sichtbar für</dt><dd>${i.vis === 'client' ? '👁 Kunde (als: „' + esc(i.ctext || i.title) + '“)' : '🔒 nur intern'}</dd></dl>
  ${i.st === 'needs_check' ? `<div class="row-acts"><button class="btn by" onclick="verify('${i.id}')">Geprüft → Erledigt</button><button class="btn b2" onclick="back('${i.id}')">Zurück an ${esc(i.doer)}</button></div><p class="muted">Erledigt geht nur mit Nachweis. Ein Agent kann nie selbst „Erledigt“ setzen.</p>` : ''}
  <h3 style="margin-top:18px;font-size:15px">Verlauf dieser Aufgabe</h3><div class="feed"><div>${ageTxt(i.since)} · angelegt von <b>Morning Grill</b><br><i>Quelle: tasks.json ${esc(i.id)}</i></div>${i.doer !== i.acc ? `<div>übergeben von <b>${esc(i.acc)}</b> an <b>${esc(i.doer)}</b></div>` : ''}</div>`;
  d.classList.add('on');
}
function verify(id) { const i = ITEMS.find(x => x.id === id); if (!(i.src || []).some(s => s[2] === 'produced' || s[2] === 'proves')) { alert('Kein Nachweis verlinkt. Erst Nachweis ergänzen.'); return; } i.st = 'done'; $('drawer').classList.remove('on'); rerender(); }
function back(id) { const i = ITEMS.find(x => x.id === id); i.st = 'in_progress'; $('drawer').classList.remove('on'); rerender(); }
function openSrc(id, k) { const s = ITEMS.find(x => x.id === id).src[k]; alert('Prototyp: öffnet die Quelle\n' + s[0] + '\nArt: ' + s[1] + ' · ' + (s[2] === 'produced' ? 'vom Agenten erzeugt' : s[2] === 'proves' ? 'Nachweis' : 'genutzt')); }

/* ---------- Navigation ---------- */
let VIEW = 'today';
function show(v) { VIEW = v; document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.v === v)); ['today','client','team','cview'].forEach(s => $(s).hidden = s !== v); if (v !== 'team') $('who').textContent = v === 'cview' ? 'Vorschau: so sieht es Coralie' : 'Angemeldet als Martin (Admin)'; rerender(); window.scrollTo(0, 0); }
function rerender() { ({today: renderToday, client: renderClient, team: renderTeam, cview: renderCview})[VIEW](); }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.v));
rerender();
</script>
</body>
</html>
