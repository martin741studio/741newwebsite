<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  .post {
    position:relative; width:1080px; height:1920px;
    background:#111111;
    font-family:'DM Sans', Arial, sans-serif;
    color:#fff; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .halftone {
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.07) 2px, transparent 2px);
    background-size:22px 22px;
    -webkit-mask-image:linear-gradient(150deg, transparent 40%, black 80%);
            mask-image:linear-gradient(150deg, transparent 40%, black 80%);
  }
  .diag {
    position:absolute; left:-160px; top:560px;
    width:620px; height:70px; background:#fac118;
    transform:rotate(-14deg); opacity:.12;
  }
  .top {
    position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:120px 72px 0;
  }
  .top img { height:56px; }
  .tag {
    font-weight:700; font-size:26px; letter-spacing:4px;
    color:#fac118; border:3px solid #fac118;
    padding:14px 30px; border-radius:999px;
  }
  .main {
    position:relative; z-index:2; flex:1;
    display:flex; flex-direction:column; justify-content:center;
    padding:40px 72px 0;
  }
  .eyebrow {
    color:#fac118; font-weight:700; font-size:34px;
    letter-spacing:8px; margin-bottom:36px;
  }
  h1 {
    font-family:'Anton', Impact, sans-serif;
    font-weight:400; text-transform:uppercase;
    font-size:118px; line-height:1.05; letter-spacing:1px;
  }
  h1 .hl {
    display:inline-block; background:#fac118; color:#111;
    padding:0 20px; margin-top:14px;
  }
  .sub {
    margin-top:56px; font-size:42px; line-height:1.5;
    color:#e8e8e8; max-width:860px; font-weight:500;
  }
  .sub b { color:#fac118; font-weight:700; }
  .sticker {
    position:relative; z-index:3;
    width:320px; height:320px; border-radius:50%;
    background:#fac118; color:#111;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-8deg);
    box-shadow:0 0 0 12px #111, 0 0 0 17px #fac118;
    text-align:center;
    margin:70px auto 0;
  }
  .sticker .w { font-weight:700; font-size:30px; letter-spacing:4px; }
  .sticker .v { font-family:'Anton', Impact, sans-serif; font-size:88px; line-height:1; margin-top:8px; }
  .cta {
    position:relative; z-index:2;
    background:#fac118; color:#111;
    text-align:center;
    padding:44px 72px;
  }
  .cta .t { font-family:'Anton', Impact, sans-serif; text-transform:uppercase; font-size:56px; letter-spacing:1px; }
  .cta .s { font-weight:700; font-size:30px; margin-top:10px; letter-spacing:2px; }
  .legal {
    position:relative; z-index:2;
    display:flex; justify-content:space-between;
    padding:26px 72px 120px; background:#111;
    color:#9a9a9a; font-size:23px; font-weight:500; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="post">
  <div class="halftone"></div>
  <div class="diag"></div>

  <div class="top">
    <img src="file:///Users/martindrendel/741website/04_site/assets/images/logo_white.png" alt="741">
    <div class="tag">GEWINNSPIEL</div>
  </div>

  <div class="main">
    <div class="eyebrow">ES IST OFFIZIELL:</div>
    <h1>DAS 741<br>SICHTBARKEITS&#8209;<br><span class="hl">STIPENDIUM</span></h1>
    <div class="sub">Wir machen <b>1 Business komplett sichtbar.</b><br>Website. Google. Local SEO. Alles.</div>
    <div class="sticker">
      <div class="w">WERT</div>
      <div class="v">5.000&nbsp;€</div>
    </div>
  </div>

  <div class="cta">
    <div class="t">Kostenlos bewerben</div>
    <div class="s">→ LINK IN BIO</div>
  </div>
  <div class="legal">
    <span>741.studio</span>
    <span>Teilnahme kostenlos · Bedingungen auf der Seite</span>
  </div>
</div>
</body>
</html>
