<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1080px;height:1080px;overflow:hidden}
 .post{position:relative;width:1080px;height:1080px;background:#111;font-family:'DM Sans',Arial,sans-serif;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:120px 100px}
 .halftone{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.06) 2px,transparent 2px);background-size:24px 24px;-webkit-mask-image:linear-gradient(120deg,transparent 40%,black 85%);mask-image:linear-gradient(120deg,transparent 40%,black 85%)}
 .diag{position:absolute;right:-140px;top:-60px;width:460px;height:460px;border-radius:50%;background:#fac118;opacity:.10}
 .quote{position:relative;z-index:2;font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:58px;line-height:1.12;white-space:pre-wrap}
 .quote .hl{display:inline;background:#fac118;color:#111;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 8px}
 .sig{position:relative;z-index:2;margin-top:56px;display:flex;align-items:center;gap:16px}
 .sig img{height:40px}
 .sig b{font-family:'Anton',Impact,sans-serif;font-size:26px;color:#fac118;letter-spacing:1px}
</style></head><body>
<div class="post">
 <div class="halftone"></div><div class="diag"></div>
 <div class="quote">{{QUOTE}}</div>
 <div class="sig"><img src="file:///Users/martindrendel/741website/04_site/assets/images/logo_white.png" alt="741"><b>741.STUDIO</b></div>
</div>
</body></html>
