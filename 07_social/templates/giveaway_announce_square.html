<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; overflow:hidden; }
  .post {
    position:relative; width:1080px; height:1080px;
    background:#111111;
    font-family:'DM Sans', Arial, sans-serif;
    color:#fff;
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  /* halftone texture */
  .halftone {
    position:absolute; inset:0;
    background-image:radial-gradient(circle, rgba(255,255,255,0.07) 2px, transparent 2px);
    background-size:22px 22px;
    -webkit-mask-image:linear-gradient(115deg, transparent 42%, black 78%);
            mask-image:linear-gradient(115deg, transparent 42%, black 78%);
  }
  /* yellow diagonal accent bottom-left */
  .diag {
    position:absolute; left:-160px; bottom:110px;
    width:520px; height:64px; background:#fac118;
    transform:rotate(-14deg);
    opacity:.14;
  }
  .diag2 {
    position:absolute; left:-200px; bottom:30px;
    width:520px; height:24px; background:#fac118;
    transform:rotate(-14deg);
    opacity:.10;
  }
  .top {
    position:relative; z-index:2;
    display:flex; justify-content:space-between; align-items:center;
    padding:56px 64px 0;
  }
  .top img { height:52px; }
  .tag {
    font-weight:700; font-size:24px; letter-spacing:4px;
    color:#fac118; border:3px solid #fac118;
    padding:12px 26px; border-radius:999px;
  }
  .main {
    position:relative; z-index:2; flex:1;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 64px;
  }
  .eyebrow {
    color:#fac118; font-weight:700; font-size:30px;
    letter-spacing:7px; margin-bottom:28px;
  }
  h1 {
    font-family:'Anton', Impact, sans-serif;
    font-weight:400; text-transform:uppercase;
    font-size:110px; line-height:1.04; letter-spacing:1px;
  }
  h1 .hl {
    display:inline-block; background:#fac118; color:#111;
    padding:0 18px; margin-top:10px;
  }
  .sub {
    margin-top:44px; font-size:35px; line-height:1.45;
    color:#e8e8e8; max-width:680px; font-weight:500;
  }
  .sub b { color:#fac118; font-weight:700; }
  /* value sticker */
  .sticker {
    position:absolute; right:64px; bottom:225px; z-index:3;
    width:250px; height:250px; border-radius:50%;
    background:#fac118; color:#111;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(10deg);
    box-shadow:0 0 0 10px #111, 0 0 0 14px #fac118;
    text-align:center;
  }
  .sticker .w { font-weight:700; font-size:24px; letter-spacing:3px; }
  .sticker .v { font-family:'Anton', Impact, sans-serif; font-size:66px; line-height:1; margin-top:6px; }
  .cta {
    position:relative; z-index:2;
    background:#fac118; color:#111;
    display:flex; justify-content:space-between; align-items:center;
    padding:34px 64px; margin:0;
  }
  .cta .t { font-family:'Anton', Impact, sans-serif; text-transform:uppercase; font-size:46px; letter-spacing:1px; }
  .cta .arrow { font-family:'Anton', Impact, sans-serif; font-size:46px; }
  .legal {
    position:relative; z-index:2;
    display:flex; justify-content:space-between;
    padding:20px 64px 26px; background:#111;
    color:#9a9a9a; font-size:21px; font-weight:500; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="post">
  <div class="halftone"></div>
  <div class="diag"></div>
  <div class="diag2"></div>

  <div class="top">
    <img src="file:///Users/martindrendel/741website/04_site/assets/images/logo_white.png" alt="741">
    <div class="tag">GEWINNSPIEL</div>
  </div>

  <div class="main">
    <div class="eyebrow">ES IST OFFIZIELL:</div>
    <h1>DAS 741<br>SICHTBARKEITS&#8209;<br><span class="hl">STIPENDIUM</span></h1>
    <div class="sub">Wir machen <b>1 Business komplett sichtbar.</b><br>Website. Google. Local SEO. Alles.</div>
  </div>

  <div class="sticker">
    <div class="w">WERT</div>
    <div class="v">5.000&nbsp;€</div>
  </div>

  <div class="cta">
    <div class="t">Kostenlos bewerben</div>
    <div class="arrow">→ LINK IN BIO</div>
  </div>
  <div class="legal">
    <span>741.studio</span>
    <span>Teilnahme kostenlos · Teilnahmebedingungen auf der Seite</span>
  </div>
</div>
</body>
</html>
