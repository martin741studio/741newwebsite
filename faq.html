    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    /* Akira Footer Dog Interaction */
    #akira-traveler {
      position: absolute;
      bottom: 0px;
      animation: runX 30s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      pointer-events: auto;
    }

    #akira-flipper {
      animation: flipX 30s step-end infinite;
    }

    .akira-sprite {
      width: 96px;
      height: 96px;
      position: relative;
    }

    .akira-frame {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
    }

    .akira-frame-1 {
      animation: spriteCycle 0.6s step-end infinite;
      animation-delay: 0s;
    }

    .akira-frame-2 {
      animation: spriteCycle 0.6s step-end infinite;
      animation-delay: 0.15s;
    }

    .akira-frame-3 {
      animation: spriteCycle 0.6s step-end infinite;
      animation-delay: 0.3s;
    }

    .akira-frame-4 {
      animation: spriteCycle 0.6s step-end infinite;
      animation-delay: 0.45s;
    }

    @keyframes spriteCycle {
      0% {
        opacity: 1;
      }

      25%,
      50%,
      75%,
      100% {
        opacity: 0;
      }
    }

    @keyframes flipX {

      0%,
      49.99%,
      100% {
        transform: scaleX(1);
      }

      50%,
      99.99% {
        transform: scaleX(-1);
      }
    }

    @keyframes runX {
      0% {
        left: -80px;
      }

      49.99% {
        left: calc(100% + 80px);
      }

      50% {
        left: calc(100% + 80px);
      }

      99.99% {
        left: -80px;
      }

      100% {
        left: -80px;
      }
    }

    .akira-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      transform-origin: bottom center;
      background: #fdfdfd;
      border: 2px solid #111;
      padding: 10px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      line-height: 1.6;
      color: #111;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 150ms ease-out, transform 150ms ease-out, visibility 150ms;
      box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.8);
      z-index: 10;
      margin-bottom: 4px;
      text-align: center;
    }

    .akira-bubble.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .akira-bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0 0;
      border-style: solid;
      border-color: #111 transparent transparent transparent;
    }

    .akira-bubble::before {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px 4px 0 0;
      border-style: solid;
      border-color: #fdfdfd transparent transparent transparent;
      z-index: 1;
    }

  <script>

        clearTimeout(akiraBubbleTimer);
      } else {
        bubble.classList.add('show');
        clearTimeout(akiraBubbleTimer);
        akiraBubbleTimer = setTimeout(() => {
          bubble.classList.remove('show');
        }, 5000); // Auto-hide after 5 seconds
      }
    }
