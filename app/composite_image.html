<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    canvas { background: transparent; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button onclick="download()">Download Image</button>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    
    // Load original
    const orig = new Image();
    orig.src = '/assets/images/hcard-color_reference.avif';
    
    // Load new background
    const bg = new Image();
    bg.src = '/assets/images/sunburst_flare_hero.png';
    
    let loaded = 0;
    orig.onload = checkLoaded;
    bg.onload = checkLoaded;
    
    function checkLoaded() {
      loaded++;
      if (loaded === 2) {
        // Set canvas to original dimensions
        canvas.width = orig.width;
        canvas.height = orig.height;
        
        // 1. Draw new background
        // Fill canvas logic if proportions differ
        ctx.fillStyle = "#1e1e1e";
        ctx.fillRect(0,0, canvas.width, canvas.height);
        
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
        
        // 2. We want to extract just the top 50 pixels (or so) from the original where the label is
        // We will draw just that slice over the top
        const labelHeight = 85; 
        
        // We also want the border. Easiest way: mask it. 
        // For now, let's just lay the top label down.
        ctx.drawImage(orig, 0, 0, canvas.width, labelHeight, 0, 0, canvas.width, labelHeight);
      }
    }
    
    function download() {
      const link = document.createElement('a');
      link.download = 'sunburst_flare_composite.webp';
      link.href = canvas.toDataURL('image/webp', 0.9);
      link.click();
    }
  </script>
</body>
</html>
