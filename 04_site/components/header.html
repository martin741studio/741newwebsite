<script>
  (function () {
    // Auto-deliver German to visitors in DE/AT/CH; everyone else stays English.
    // Respect an explicit EN|DE choice made this session (set by the toggle).
    if (sessionStorage.getItem('lang_override')) return;
    // Defensive: never run on the German side (this partial is EN-only anyway).
    if (window.location.pathname.indexOf('/de/') === 0) return;
    // Review pages exist only once (no /de/ twin): never redirect them (2026-10-12, /de/review/... gave 404 for DACH visitors).
    if (window.location.pathname.indexOf('/review/') === 0) return;

    var DACH = ['DE', 'AT', 'CH'];

    function handle(cc) {
      // A valid country was resolved. Redirect only if it's DACH.
      if (cc && DACH.indexOf(String(cc).toUpperCase()) !== -1) {
        sessionStorage.setItem('lang_override', 'de');
        var path = window.location.pathname;
        // Prefer an explicit German alternate (slugs can differ, e.g. the giveaway page)
        // over the naive /de-prefix, which would 404 when the DE slug isn't identical.
        var alt = document.querySelector('link[rel=alternate][hreflang=de]');
        // replace() so the English page isn't left in the Back-button history.
        window.location.replace(alt ? alt.getAttribute('href') : (path === '/' ? '/de/' : '/de' + path));
      }
    }

    // Resilient geo lookup. All three are free, keyless and CORS-enabled.
    // We only fall through to the next provider if a request truly fails
    // (network error / rate limit) so a single outage can't wrongly serve
    // English to a DACH visitor.
    function geojs() {
      return fetch('https://get.geojs.io/v1/ip/country.json')
        .then(function (r) { return r.json(); })
        .then(function (d) { if (!d || !d.country) throw new Error('no-country'); handle(d.country); });
    }
    function ipwho() {
      return fetch('https://ipwho.is/')
        .then(function (r) { return r.json(); })
        .then(function (d) { if (!d || !d.country_code) throw new Error('no-country'); handle(d.country_code); });
    }
    function ipapi() {
      return fetch('https://ipapi.co/json/')
        .then(function (r) { return r.json(); })
        .then(function (d) { if (!d || !d.country_code) throw new Error('no-country'); handle(d.country_code); });
    }

    geojs()
      .catch(ipwho)
      .catch(ipapi)
      .catch(function (err) { console.log('Geo language check unavailable, staying in English', err); });
  })();
</script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navbar = document.querySelector('.navbar_main');
      if (!navbar) return;

      let lastScrollTop = window.scrollY || document.documentElement.scrollTop;

      window.addEventListener('scroll', () => {
        if (window.innerWidth <= 768) {
          let currentScroll = window.scrollY || document.documentElement.scrollTop;

          // Downward scroll (buffer of 60px to avoid jumpiness at the very top)
          if (currentScroll > lastScrollTop && currentScroll > 60) {
            navbar.classList.add('is-hidden-up');
          }
          // Upward scroll
          else if (currentScroll < lastScrollTop) {
            navbar.classList.remove('is-hidden-up');
          }

          lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        } else {
          navbar.classList.remove('is-hidden-up');
        }
      });

      // Mobile Menu Logic
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const navLinksWrapper = document.querySelector('.nav-links-wrapper');
      const navLinks = document.querySelectorAll('.nav-links-wrapper .nav_text-link:not(.nav_dropdown-toggle)');

      if (mobileMenuBtn && navLinksWrapper) {
        // Break out of Webflow's navbar CSS by moving the overlay directly to the body!
        // This permanently prevents parent transforms or overflow:hidden from breaking the dark background.
        if (window.innerWidth <= 768) {
          document.body.appendChild(navLinksWrapper);
        }

        // Lock body scroll while the overlay is open — without this, iOS momentum/bounce
        // scroll events fired the old "close on scroll" handler and shut the menu
        // before a tap could land on a link.
        const setMenuOpen = (open) => {
          navLinksWrapper.classList.toggle('is-open', open);
          document.body.style.overflow = open ? 'hidden' : '';
        };

        mobileMenuBtn.addEventListener('click', (e) => {
          e.preventDefault();
          setMenuOpen(!navLinksWrapper.classList.contains('is-open'));
        });

        // Close menu when a link is clicked
        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            setMenuOpen(false);
          });
        });

        // Dropdown toggle logic (desktop & mobile)
        const dropdown = document.querySelector('.nav_dropdown');
        const toggle = document.querySelector('.nav_dropdown-toggle');
        if (toggle && dropdown) {
          toggle.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            dropdown.classList.toggle('is-open');
          });

          document.addEventListener('click', () => {
            dropdown.classList.remove('is-open');
          });
        }
      }
    });
  </script>
