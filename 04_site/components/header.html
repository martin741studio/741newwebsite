  <style>
    /* 1. Scale UP the top banner text on mobile for readability */
    @media screen and (max-width: 768px) {

      }
    }

    /* 2. Global setting to smooth transition the individually fixed header components up and down on mobile scroll */
    @media screen and (max-width: 768px) {

      .navbar_main.is-hidden-up .banner_component,
      .navbar_main.is-hidden-up .navbar-left,
      .navbar_main.is-hidden-up .navbar-right,
      .navbar_main.is-hidden-up .huge_nav-button.is-real {
        transform: translateY(-250%) !important;
      }

      /* Apply transition directly to the elements that are fixed by Weavy */
      .navbar_main .banner_component,
      .navbar_main .navbar-left,
      .navbar_main .navbar-right,
      .navbar_main .huge_nav-button.is-real {
        transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1) !important;
      }
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navbar = document.querySelector('.navbar_main');
      if (!navbar) return;

      let lastScrollTop = window.scrollY || document.documentElement.scrollTop;

      window.addEventListener('scroll', () => {
        if (window.innerWidth <= 768) {
          let currentScroll = window.scrollY || document.documentElement.scrollTop;

          // Downward scroll (buffer of 60px to avoid jumpiness at the very top)
          if (currentScroll > lastScrollTop && currentScroll > 60) {
            navbar.classList.add('is-hidden-up');
          }
          // Upward scroll
          else if (currentScroll < lastScrollTop) {
            navbar.classList.remove('is-hidden-up');
          }

          lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        } else {
          navbar.classList.remove('is-hidden-up');
        }
      });
    });
  </script>
