  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const navbar = document.querySelector('.navbar_main');
      if (!navbar) return;

      let lastScrollTop = window.scrollY || document.documentElement.scrollTop;

      window.addEventListener('scroll', () => {
        if (window.innerWidth <= 768) {
          let currentScroll = window.scrollY || document.documentElement.scrollTop;

          // Downward scroll (buffer of 60px to avoid jumpiness at the very top)
          if (currentScroll > lastScrollTop && currentScroll > 60) {
            navbar.classList.add('is-hidden-up');
          }
          // Upward scroll
          else if (currentScroll < lastScrollTop) {
            navbar.classList.remove('is-hidden-up');
          }

          lastScrollTop = currentScroll <= 0 ? 0 : currentScroll;
        } else {
          navbar.classList.remove('is-hidden-up');
        }
      });

      // Mobile Menu Logic
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const navLinksWrapper = document.querySelector('.nav-links-wrapper');
      const navLinks = document.querySelectorAll('.nav-links-wrapper .nav_text-link');

      if (mobileMenuBtn && navLinksWrapper) {
        // Break out of Webflow's navbar CSS by moving the overlay directly to the body!
        // This permanently prevents parent transforms or overflow:hidden from breaking the dark background.
        if (window.innerWidth <= 768) {
          document.body.appendChild(navLinksWrapper);
        }

        mobileMenuBtn.addEventListener('click', (e) => {
          e.preventDefault();
          navLinksWrapper.classList.toggle('is-open');
        });

        // Close menu when a link is clicked
        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            navLinksWrapper.classList.remove('is-open');
          });
        });

        // Close menu on scroll if it is open
        window.addEventListener('scroll', () => {
          if (navLinksWrapper.classList.contains('is-open')) {
            navLinksWrapper.classList.remove('is-open');
          }
        }, { passive: true });
      }
    });
  </script>
