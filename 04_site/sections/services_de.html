<div class="gsap_models_scroll w-embed w-script">
<style>
      .models_bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transform: scale(1);
        transition: opacity 0.05s ease, transform 0.05s ease;
        z-index: 0;
        pointer-events: none;
      }

      .models_item {
        color: #ffffff;
        transition: color 0.15s ease;
      }

      .models_item-list {
        min-height: 85vh !important;
        /* Reduced from 175vh because there are 8 items instead of 15 */
        padding-bottom: 10vh !important;
      }
    </style>
<script>
      gsap.registerPlugin(ScrollTrigger);

      const items = gsap.utils.toArray('.models_item');
      const backgrounds = gsap.utils.toArray('.models_bg-image');

      let lastIndex = -1;

      function activateItem(index) {
        if (index === lastIndex) return;
        lastIndex = index;

        const activeColor = "#fac118";
        const inactiveColor = "rgba(255, 255, 255, 0.4)";

        backgrounds.forEach((bg, i) => {
          const isActive = i === index;

          gsap.to(bg, {
            opacity: isActive ? 1 : 0,
            scale: isActive ? 1.02 : 1,
            zIndex: isActive ? 1 : 0,
            duration: 0.05,
            ease: "power2.out"
          });

          const video = bg.querySelector("video");

          if (video) {
            try {
              if (isActive) {
                if (video.paused || video.readyState < 3) {
                  video.muted = true;
                  video.playsInline = true;
                  video.setAttribute("playsinline", "");
                  video.setAttribute("webkit-playsinline", "");
                  video.play().catch(err => {
                    console.warn("Autoplay blocked:", err);
                  });
                }
              } else {
                video.pause();
                video.currentTime = 0;
              }
            } catch (e) {
              console.warn("Video playback error:", e);
            }
          }
        });

        items.forEach((el, i) => {
          gsap.to(el, {
            color: i === index ? activeColor : inactiveColor,
            duration: 0.08,
            ease: "power1.out"
          });
        });
      }

      const isMobile = window.innerWidth <= 768;

      items.forEach((item, i) => {
        ScrollTrigger.create({
          trigger: item,
          start: isMobile ? 'top 40%' : 'top 20%',
          end: isMobile ? 'bottom center' : 'bottom center',
          onEnter: () => activateItem(i),
          onEnterBack: () => activateItem(i)
        });
      });

      // Fallback activation on page load
      window.addEventListener('load', () => {
        requestAnimationFrame(() => {
          const scrollY = window.scrollY || window.pageYOffset;
          const viewportHeight = window.innerHeight;
          let found = false;

          items.forEach((item, i) => {
            const rect = item.getBoundingClientRect();
            const top = rect.top + scrollY;
            const bottom = top + rect.height;
            const inView = top < (scrollY + viewportHeight) && bottom > scrollY;

            if (inView && !found) {
              activateItem(i);
              found = true;
            }
          });

          if (!found && items.length) {
            activateItem(0);
          }
        });
      });
    </script>
