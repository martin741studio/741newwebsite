        // DOM elements
        const grid = document.getElementById('articles-grid');
        const searchInput = document.getElementById('search-bar');
        const filterBtns = document.querySelectorAll('.filter_btn');
        const emptyState = document.getElementById('empty-state');

        let activeCategory = 'all';
        let searchQuery = '';

        // Render articles list
        function renderArticles() {
            // Filter list
            const filtered = articles.filter(art => {
                const matchesCategory = activeCategory === 'all' || art.category === activeCategory;
                const matchesSearch = art.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                     art.excerpt.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            // Handle empty state
            if (filtered.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            // Generate HTML
            grid.innerHTML = filtered.map(art => `
                <div class="blog_card reveal-item" data-category="${art.category}">
                    <div class="card_image_placeholder">
                        <span class="card_category_chip">${art.categoryLabel}</span>
                        <div class="card_icon_wrap">
                            ${art.icon}
                        </div>
                    </div>
                    <div class="card_body">
                        <div class="card_meta">
                            <span>${art.date}</span>
                            <span>•</span>
                            <span>${art.readTime}</span>
                        </div>
                        <h3 class="card_title">${art.title}</h3>
                        <p class="card_excerpt">${art.excerpt}</p>
                        <a href="${art.url}" class="card_link">
                            Read Article
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                        </a>
                    </div>
                </div>
            `).join('');

            // Apply entry animation using GSAP
            gsap.fromTo(".reveal-item", 
                { y: 20, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.4, stagger: 0.05, ease: "power2.out" }
            );
        }

        // Initialize listeners
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderArticles();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => b.classList.remove('is-active'));
                btn.classList.add('is-active');
                activeCategory = btn.getAttribute('data-filter');
                renderArticles();
            });
        });

        // Initial render
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);
            renderArticles();

            // Hero animations
            gsap.fromTo(".reveal-up",
                { y: 30, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.8, ease: "power2.out", stagger: 0.1 }
            );
        });
    </script>
