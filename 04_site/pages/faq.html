<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Frequently Asked Questions | 741 Studio</title>
    <meta content="Frequently Asked Questions" name="description" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="/assets/weavy.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --brand--lemon: #fac118;
            --brand--ash-grey: #8c8c8c;
            --brand--french-gray: #fac118;
            --brand--french-gray-op-45: rgba(250, 193, 24, 0.45);
        }

        body {
            background-color: #111;
            color: #fff;
        }

        .huge_nav-button,
        .button {
            background-color: var(--brand--lemon) !important;
            color: black !important;
            border: none !important;
        }

        .footer_logo-text {
            color: var(--brand--lemon) !important;
            font-weight: bold;
        }

        .section-faq-hero {
            background-color: #111;
            padding: 120px 5%;
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .faq-headline {
            font-size: 3rem;
            text-align: center;
            color: #fff;
        }
    </style>
    <!-- Nav button forced styling -->
    <style>
        .huge_nav-button {
            mix-blend-mode: normal !important;
        }
    </style>
    <script
        type="text/javascript">!function (o, c) { var n = c.documentElement, t = " w-mod-"; n.className += t + "js", ("ontouchstart" in o || o.DocumentTouch && c instanceof DocumentTouch) && (n.className += t + "touch") }(window, document);</script>
    <link href="/assets/images/favicon_yellow_v2.png" rel="shortcut icon" type="image/png" />
    <link href="/assets/images/favicon_yellow_v2.png" rel="apple-touch-icon" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

</head>

<body>
    <div class="code_responsive-dom w-embed">
        <style>
            html,
            body {
                font-size: 1vw;
            }

            @media screen and (min-width: 1440px) {

                html,
                body {
                    font-size: 14.4px;
                }
            }

            @media screen and (max-width: 600px) {

                html,
                body {
                    font-size: 1.8vw;
                }
            }
        </style>
    </div>
    <div class="page-wrapper">
        <div class="main-wrapper">
            {{> header }}
            <section class="section-faq-hero">
                <h1 class="faq-headline">Frequently Asked Questions</h1>
            </section>
            {{> footer }}
        </div>
    </div>


    <!-- Lenis JS -->
    <script defer src="https://unpkg.com/lenis@1.2.3/dist/lenis.min.js"></script>
    <!-- Lenis JS function tweaks-->
    <script defer>
        document.addEventListener("DOMContentLoaded", function () {
            // Initialize Lenis
            const lenis = new Lenis({
                lerp: 0.1,
                wheelMultiplier: 0.9,
                gestureOrientation: "vertical",
                normalizeWheel: false,
                smoothTouch: false
            });

            // Sync Lenis scroll with GSAP ScrollTrigger
            lenis.on('scroll', ScrollTrigger.update);

            // Add Lenis to GSAP's ticker so both update together
            gsap.ticker.add((time) => {
                lenis.raf(time * 1000); // Convert GSAP time (seconds) to ms
            });

            // Disable GSAP lag smoothing for precise scroll updates
            gsap.ticker.lagSmoothing(0);
        });
    </script>

    <!-- Nav button shrink and grow (EDGAR) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            gsap.registerPlugin(ScrollTrigger);

            const navLinks = document.querySelectorAll(".nav-link-text-block-large");

            // Detect screen width (landscape and down: 767px and below)
            const isMobileOrTablet = window.matchMedia("(max-width: 767px)").matches;

            if (!isMobileOrTablet) {
                const tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: "body",
                        start: "top top",
                        end: "150px",
                        scrub: true,
                        onUpdate: (self) => {
                            navLinks.forEach(el => {
                                if (self.progress > 0.5) {
                                    el.classList.remove("nav-normal-case");
                                } else {
                                    el.classList.add("nav-normal-case");
                                }
                            });
                        }
                    }
                });

                tl.to(".nav-link-text-block-large", {
                    fontSize: "12px",
                    letterSpacing: "0.15px",
                    ease: "power2.out"
                }, 0);

                tl.to(".nav-button-spacer", {
                    height: "0rem",
                    ease: "power2.out"
                }, 0);
            }
        });
    </script>
</body>

</html>
