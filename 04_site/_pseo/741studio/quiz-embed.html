<style>
.qz-overlay{position:fixed;inset:0;background:rgba(20,20,20,.55);backdrop-filter:blur(3px);z-index:1000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px;}
.qz-overlay.open{display:flex;}
.qz{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:34px 30px 28px;position:relative;margin:auto 0;}
.qz-close{position:absolute;top:14px;right:16px;background:none;border:none;font-size:26px;color:var(--ash);cursor:pointer;line-height:1;}
.qz-progress{height:6px;background:var(--eggshell);border-radius:99px;overflow:hidden;margin-bottom:10px;}
.qz-progress i{display:block;height:100%;background:var(--yellow);border-radius:99px;transition:width .25s;}
.qz-step-label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ash);margin-bottom:14px;}
.qz h3{font-size:23px;line-height:1.25;margin-bottom:8px;}
.qz-sub{font-size:14.5px;color:var(--stone);margin-bottom:18px;}
.qz-opts{display:flex;flex-direction:column;gap:10px;}
.qz-opt{text-align:left;background:var(--cream);border:1.5px solid var(--eggshell);border-radius:12px;padding:15px 16px;font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .12s, transform .12s;font-family:inherit;}
.qz-opt:hover{border-color:var(--yellow);transform:translateY(-1px);}
.qz label{display:block;font-size:13.5px;font-weight:700;margin:14px 0 6px;}
.qz input[type=text],.qz input[type=email],.qz input[type=tel]{width:100%;padding:13px 14px;border:1.5px solid var(--eggshell);border-radius:10px;font-size:16px;font-family:inherit;}
.qz input:focus{outline:none;border-color:var(--yellow);}
.qz-consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--stone);margin-top:14px;line-height:1.45;}
.qz-consent input{margin-top:3px;}
.qz-err{display:none;background:#fdeaea;color:#b3402e;font-size:13.5px;border-radius:8px;padding:9px 12px;margin-top:12px;}
.qz-err.show{display:block;}
.qz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
.qz-back{background:none;border:none;color:var(--ash);font-size:14px;cursor:pointer;font-family:inherit;}
.qz-next{background:var(--yellow);color:var(--ink);border:none;font-weight:800;font-size:16px;padding:13px 22px;border-radius:10px;cursor:pointer;font-family:inherit;transition:transform .12s;}
.qz-next:hover{transform:translateY(-1px);}
.qz-next:disabled{opacity:.6;cursor:wait;transform:none;}
.qz-trust{display:flex;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--eggshell);font-size:12.5px;color:var(--ash);flex-wrap:wrap;}
.qz-success{text-align:center;padding:8px 0 4px;}
.qz-success svg{margin-bottom:14px;}
.qz-success h3{margin-bottom:12px;}
.qz-success p{font-size:14.5px;color:var(--stone);margin-bottom:10px;text-align:left;}
.qz-timer{display:inline-block;background:#fdf7d8;border:1.5px solid #f0d97a;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14.5px;margin-bottom:14px;}

@media(max-width:820px){
  .cards,.steps{grid-template-columns:1fr;}
  .hero{padding:40px 0 36px;}
  .proof{flex-direction:column;text-align:center;}
}
</style>
<div class="qz-overlay" id="qzOverlay" role="dialog" aria-modal="true">
  <div class="qz">
    <button class="qz-close" id="qzClose" aria-label="Schließen">×</button>
    <div class="qz-progress"><i id="qzBar" style="width:16%"></i></div>
    <div class="qz-step-label" id="qzStepLabel">Schritt 1 von 6</div>
    <div id="qzBody"></div>
    <div class="qz-err" id="qzErr"></div>
    <div class="qz-nav" id="qzNav">
      <button class="qz-back" id="qzBack" style="visibility:hidden">← Zurück</button>
      <button class="qz-next" id="qzNext" style="display:none">Weiter →</button>
    </div>
    <div class="qz-trust">
      <span>🔒 DSGVO-konform</span><span>⏱ Analyse in ca. 2 Stunden</span><span>🎥 Individuelles Video</span><span>💬 Zustellung per WhatsApp &amp; E-Mail</span>
    </div>
  </div>
</div>


<script>
var QZ_CONFIG = {
  SUPABASE_URL: "https://bgiljrygqvlgwsrjvhnp.supabase.co",
  SUPABASE_KEY: "sb_publishable_Yuu6gXfuXNQdgWkdIqfU9Q_hmNyX3kH",
  WEBHOOK_URL: "",
  FALLBACK_EMAIL: "hello@741.studio",
  FALLBACK_CC: "martin@741.studio"
};

(function(){
  var steps = [
    { key:'branche', type:'options',
      q:'Welche Art von Unternehmen führen Sie?',
      sub:'Damit die Analyse auf Ihren Markt zugeschnitten ist.',
      opts:[
        {v:'Praxis / Gesundheitswesen', t:'Praxis / Gesundheitswesen'},
        {v:'Handwerk / Bau', t:'Handwerk / Bau'},
        {v:'Gastronomie / Hotellerie', t:'Gastronomie / Hotellerie'},
        {v:'Dienstleistung', t:'Dienstleistung (Kanzlei, Studio, Kosmetik …)'},
        {v:'Anderes lokales Unternehmen', t:'Anderes lokales Unternehmen'}
      ]},
    { key:'akquise', type:'options',
      q:'Wie gewinnen Sie aktuell hauptsächlich neue Kunden?',
      sub:'Ehrliche Antwort – es gibt kein Richtig oder Falsch.',
      opts:[
        {v:'Empfehlungen', t:'Empfehlungen & Stammkunden'},
        {v:'Google Ads', t:'Google Ads / bezahlte Werbung'},
        {v:'Social Media', t:'Social Media'},
        {v:'Kaum aktive Gewinnung', t:'Kaum aktive Neukundengewinnung'}
      ]},
    { key:'bewertungen', type:'options',
      q:'Wie viele Google-Bewertungen hat Ihr Unternehmen aktuell?',
      sub:'Einer der stärksten lokalen Rankingfaktoren.',
      opts:[
        {v:'unter 20', t:'Unter 20'},
        {v:'20 bis 100', t:'20 – 100'},
        {v:'über 100', t:'Über 100'},
        {v:'weiß nicht', t:'Weiß ich nicht genau'}
      ]},
    { key:'standort', type:'input',
      q:'In welcher Stadt / Region sind Sie tätig?',
      sub:'Für das straßengenaue Sichtbarkeits-Raster Ihres Einzugsgebiets.',
      fields:[{name:'stadt', label:'Stadt / Region', ph:'z. B. Nürnberg', type:'text', required:true}]},
    { key:'domain', type:'input',
      q:'Wie lautet Ihre Website?',
      sub:'Wir prüfen Website und Google-Profil im Wettbewerbsvergleich.',
      fields:[{name:'domain', label:'Website / Domain', ph:'z. B. www.ihr-betrieb.de', type:'text', required:true},
              {name:'praxisname', label:'Name des Unternehmens (wie bei Google)', ph:'z. B. Malerbetrieb Muster', type:'text', required:false}]},
    { key:'kontakt', type:'contact',
      q:'Wohin dürfen wir Ihre Video-Analyse senden?',
      sub:'Ihre Analyse wird manuell erstellt – als individuelles Video, zugestellt per WhatsApp und E-Mail.',
      fields:[{name:'name', label:'Ihr Name', ph:'Vor- und Nachname', type:'text', required:true},
              {name:'email', label:'E-Mail-Adresse', ph:'name@firma.de', type:'email', required:true},
              {name:'telefon', label:'Mobilnummer (für WhatsApp-Zustellung)', ph:'+49 …', type:'tel', required:true}]}
  ];

  var answers = {};
  var idx = 0;
  var overlay = document.getElementById('qzOverlay');
  var body = document.getElementById('qzBody');
  var bar = document.getElementById('qzBar');
  var stepLabel = document.getElementById('qzStepLabel');
  var nav = document.getElementById('qzNav');
  var btnBack = document.getElementById('qzBack');
  var btnNext = document.getElementById('qzNext');
  var errBox = document.getElementById('qzErr');

  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  function render(){
    var s = steps[idx];
    errBox.className='qz-err';
    bar.style.width = Math.round(((idx+1)/steps.length)*100)+'%';
    stepLabel.textContent = 'Schritt '+(idx+1)+' von '+steps.length;
    btnBack.style.visibility = idx===0 ? 'hidden':'visible';
    var h = '<h3>'+esc(s.q)+'</h3><p class="qz-sub">'+esc(s.sub)+'</p>';
    if(s.type==='options'){
      btnNext.style.display='none';
      h += '<div class="qz-opts">';
      s.opts.forEach(function(o){ h += '<button type="button" class="qz-opt" data-v="'+esc(o.v)+'">'+esc(o.t)+'</button>'; });
      h += '</div>';
    } else {
      btnNext.style.display='inline-block';
      btnNext.textContent = (s.type==='contact') ? 'Kostenlose Analyse anfordern →' : 'Weiter →';
      s.fields.forEach(function(f){
        h += '<label for="qzf_'+f.name+'">'+esc(f.label)+(f.required?'':' <span style="font-weight:400;color:var(--ash)">(optional)</span>')+'</label>';
        h += '<input id="qzf_'+f.name+'" name="'+f.name+'" type="'+f.type+'" placeholder="'+esc(f.ph)+'" value="'+esc(answers[f.name]||'')+'">';
      });
      if(s.type==='contact'){
        h += '<div class="qz-consent"><input type="checkbox" id="qzConsent"><label for="qzConsent" style="margin:0;font-weight:400;">Ich stimme zu, dass meine Angaben zur Erstellung und Zusendung der Sichtbarkeits-Analyse (per E-Mail/WhatsApp) verarbeitet werden. <a href="https://741.studio/de/pages/datenschutz.html" target="_blank" rel="noopener">Datenschutz</a></label></div>';
      }
    }
    body.innerHTML = h;
    if(s.type==='options'){
      body.querySelectorAll('.qz-opt').forEach(function(b){
        b.addEventListener('click', function(){
          answers[s.key] = b.getAttribute('data-v');
          next();
        });
      });
    }
    var first = body.querySelector('input[type=text],input[type=email],input[type=tel]');
    if(first) first.focus();
  }

  function showErr(m){ errBox.textContent=m; errBox.className='qz-err show'; }

  function validate(){
    var s = steps[idx];
    if(s.type==='options') return true;
    var ok = true;
    s.fields.forEach(function(f){
      var el = document.getElementById('qzf_'+f.name);
      var v = el ? el.value.trim() : '';
      answers[f.name] = v;
      if(f.required && !v) ok = false;
      if(f.type==='email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) ok = false;
      if(f.type==='tel' && v && v.replace(/[^0-9]/g,'').length < 7) ok = false;
    });
    if(!ok){ showErr('Bitte füllen Sie alle Pflichtfelder korrekt aus.'); return false; }
    if(s.type==='contact'){
      var c = document.getElementById('qzConsent');
      if(!c || !c.checked){ showErr('Bitte bestätigen Sie die Datenschutz-Einwilligung.'); return false; }
    }
    return true;
  }

  function next(){
    errBox.className='qz-err';
    if(idx < steps.length-1){ idx++; render(); }
    else { submit(); }
  }

  function payload(){
    return {
      quelle:(function(){try{var p=new URLSearchParams(location.search);var s=(p.get('utm_source')||'').toLowerCase(),m=(p.get('utm_medium')||'').toLowerCase(),c=p.get('utm_campaign')||p.get('utm_id')||'';if(s){var net=(s==='ig'||s==='instagram'||s==='fb'||s==='facebook'||s==='msg'||s==='an')?'Meta Ads ('+s+')':(s==='google'||s==='g'||s==='adwords')?'Google Ads':(m==='paid'?'Paid '+s:s);return net+(c?' · '+c:'')+' – Sichtbarkeits-Analyse (DE)';}}catch(e){}return 'Direkt/Organisch – Sichtbarkeits-Analyse (DE)';})(),
      seite: location.href,
      branche: answers.branche||'', akquise: answers.akquise||'', bewertungen: answers.bewertungen||'',
      stadt: answers.stadt||'', domain: answers.domain||'', praxisname: answers.praxisname||'',
      name: answers.name||'', email: answers.email||'', telefon: answers.telefon||'',
      fbclid:(function(){try{return new URLSearchParams(location.search).get('fbclid')||'';}catch(e){return '';}})(),
      fbc:(function(){try{var m=document.cookie.match(/_fbc=([^;]+)/);if(m)return decodeURIComponent(m[1]);var f=new URLSearchParams(location.search).get('fbclid');return f?('fb.1.'+Date.now()+'.'+f):'';}catch(e){return '';}})(),
      fbp:(function(){try{var m=document.cookie.match(/_fbp=([^;]+)/);return m?decodeURIComponent(m[1]):'';}catch(e){return '';}})(),
      event_id:(function(){try{return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('ld-'+Date.now()+'-'+Math.random().toString(16).slice(2));}catch(e){return 'ld-'+Date.now();}})(),
      user_agent:(function(){try{return navigator.userAgent||'';}catch(e){return '';}})()
    };
  }

  function submit(){
    btnNext.disabled = true; btnNext.textContent = 'Wird gesendet …';
    var p = payload();
    var done = function(){ try{fbq('track','Lead',{},{eventID:p.event_id});}catch(e){} /* Google Ads Conversion hier ergänzen */ success(); };
    var fallback = function(){
      var b = Object.keys(p).map(function(k){return k+': '+p[k];}).join('%0D%0A');
      window.open('mailto:'+QZ_CONFIG.FALLBACK_EMAIL+'?cc='+QZ_CONFIG.FALLBACK_CC+'&subject=Neue%20Sichtbarkeits-Analyse%20Anfrage&body='+b,'_blank');
      success();
    };
    var viaWebhook = function(){
      if(!QZ_CONFIG.WEBHOOK_URL){ fallback(); return; }
      fetch(QZ_CONFIG.WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
        .then(function(r){ if(r.ok){done();} else {fallback();} })
        .catch(fallback);
    };
    if(QZ_CONFIG.SUPABASE_URL && QZ_CONFIG.SUPABASE_KEY){
      fetch(QZ_CONFIG.SUPABASE_URL+'/rest/v1/advertorial_leads',{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':QZ_CONFIG.SUPABASE_KEY,'Prefer':'return=minimal'},
        body:JSON.stringify(p)
      }).then(function(r){ if(r.ok){done();} else {viaWebhook();} })
        .catch(viaWebhook);
    } else {
      viaWebhook();
    }
  }

  function success(){
    errBox.className='qz-err';
    bar.style.width='100%';
    stepLabel.textContent='Fertig';
    nav.style.display='none';
    body.innerHTML =
      '<div class="qz-success">'+
      '<svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34" fill="#fac118"/><path d="M21 37 L32 48 L52 26" fill="none" stroke="#252525" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '<h3>Vielen Dank, '+esc((answers.name||'').split(' ')[0])+'! Ihre Analyse ist in Arbeit.</h3>'+
      '<div class="qz-timer">⏱ Zustellung innerhalb der nächsten 2 Stunden*</div>'+
      '<p>Wir erstellen Ihre Sichtbarkeits-Analyse jetzt <b>manuell</b> – inklusive einem <b>individuellen Video</b>, in dem wir Schritt für Schritt zeigen, wo Sie aktuell stehen, welcher Wettbewerber Sie verdrängt und welche drei Maßnahmen den größten Hebel haben.</p>'+
      '<p>Sie erhalten das Video per <b>WhatsApp</b> an '+esc(answers.telefon||'')+' und per <b>E-Mail</b> an '+esc(answers.email||'')+'.</p>'+
      '<p style="font-size:12.5px;color:var(--ash)">*Anfragen werktags zwischen 9 und 18 Uhr. Außerhalb dieser Zeiten erhalten Sie Ihre Analyse am nächsten Werktag bis 11 Uhr.</p>'+
      '</div>';
  }

  function open(){ idx=0; nav.style.display='flex'; btnNext.disabled=false; overlay.classList.add('open'); document.body.style.overflow='hidden'; try{fbq('trackCustom','QuizOpened');}catch(e){} render(); }
  function close(){ overlay.classList.remove('open'); document.body.style.overflow=''; }

  document.getElementById('qzClose').addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
  btnBack.addEventListener('click', function(){ if(idx>0){ idx--; render(); } });
  btnNext.addEventListener('click', function(){ if(validate()) next(); });

  document.querySelectorAll('[data-qz]').forEach(function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); open(); });
  });
})();
</script>
