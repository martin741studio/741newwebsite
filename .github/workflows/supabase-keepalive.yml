name: Supabase Keep-Alive (741-leads)

# Free-tier Supabase projects auto-pause after ~7 days of inactivity.
# While the Bali Google Ads campaigns run, a paused DB = lost leads + no notification emails.
# This workflow makes one lightweight authenticated request per day so the project
# never idles long enough to pause. Runs on GitHub's infra (independent of any local machine).
#
# The key below is the PUBLIC "publishable"/anon key — it is already exposed in the
# client-side JS of the live landing pages, so committing it here is not a secret leak.

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API to keep the project active
        run: |
          URL="https://bgiljrygqvlgwsrjvhnp.supabase.co/rest/v1/advertorial_leads?select=id&limit=1"
          KEY="sb_publishable_Yuu6gXfuXNQdgWkdIqfU9Q_hmNyX3kH"
          echo "Pinging 741-leads Supabase at $(date -u)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL" || echo "000")
          echo "HTTP status: $code"
          # Any HTTP response (even 401/4xx) counts as activity and keeps the project awake.
          # Only fail the job if the host was completely unreachable (network error → 000).
          if [ "$code" = "000" ]; then
            echo "::error::Supabase host unreachable — keep-alive ping did not register."
            exit 1
          fi
          echo "Keep-alive ping registered successfully."
