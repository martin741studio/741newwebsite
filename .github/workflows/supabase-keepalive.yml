name: Supabase Keep-Alive (741-leads + 741-portal)

# Free-tier Supabase projects auto-pause after ~7 days of inactivity.
# - 741-leads: a paused DB = lost leads + no notification emails.
# - 741-portal: a paused DB = client portal login fails AND the Monday weekly-mail
#   pg_cron job never fires. Both must stay awake.
# This workflow makes one lightweight authenticated request per project per day so
# neither idles long enough to pause. Runs on GitHub's infra (independent of any local machine).
#
# The keys below are the PUBLIC "publishable"/anon keys — already exposed in the
# client-side JS of the live pages, so committing them here is not a secret leak.

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:        # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 741-leads REST API
        run: |
          URL="https://bgiljrygqvlgwsrjvhnp.supabase.co/rest/v1/advertorial_leads?select=id&limit=1"
          KEY="sb_publishable_Yuu6gXfuXNQdgWkdIqfU9Q_hmNyX3kH"
          echo "Pinging 741-leads Supabase at $(date -u)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL" || echo "000")
          echo "HTTP status: $code"
          if [ "$code" = "000" ]; then
            echo "::error::741-leads host unreachable — keep-alive ping did not register."
            exit 1
          fi
          echo "741-leads keep-alive ping registered successfully."
      - name: Ping 741-portal REST API
        run: |
          URL="https://galjmtozcgxcwtzkzbpi.supabase.co/rest/v1/clients?select=id&limit=1"
          KEY="sb_publishable_hHvVDgtVIsU8E1GhlWB7RA_ZGNKYUln"
          echo "Pinging 741-portal Supabase at $(date -u)"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL" || echo "000")
          echo "HTTP status: $code"
          if [ "$code" = "000" ]; then
            echo "::error::741-portal host unreachable — keep-alive ping did not register."
            exit 1
          fi
          echo "741-portal keep-alive ping registered successfully."
